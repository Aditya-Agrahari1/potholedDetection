services:
  - type: web
    name: pothole-detection-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MATCHING_RADIUS_METERS
        value: "15.0"
      - key: DATABASE_URL
        fromDatabase:
          name: pothole-postgres
          property: connectionString

databases:
  - name: pothole-postgres
    databaseName: potholes_db
    user: pothole_user
    plan: free
